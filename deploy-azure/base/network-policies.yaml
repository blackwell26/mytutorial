---
# Default deny-all ingress traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow traffic from within the namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
spec:
  podSelector: {}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mytutorial
  policyTypes:
    - Ingress
---
# Allow Azure Load Balancer health probes (required for AKS)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-azure-lb-health-probes
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  ingress:
    - from:
        - ipBlock:
            cidr: 168.63.129.16/32
      ports:
        - port: 8080
  policyTypes:
    - Ingress
---
# Allow Prometheus to scrape all pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
spec:
  podSelector: {}
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 8080
        - port: 8081
        - port: 8082
        - port: 8083
        - port: 8761
  policyTypes:
    - Ingress
