---
# Shared ConfigMap applied to all services
apiVersion: v1
kind: ConfigMap
metadata:
  name: mytutorial-shared
data:
  SPRING_PROFILES_ACTIVE: "k8s"
  # Eureka — all services register here
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
  # Azure Application Insights (optional — uncomment to enable)
  # APPLICATIONINSIGHTS_CONNECTION_STRING: "InstrumentationKey=YOUR_KEY"
---
# Eureka Server
apiVersion: v1
kind: ConfigMap
metadata:
  name: eureka-server-config
data:
  SPRING_APPLICATION_NAME: "eureka-server"
  SERVER_PORT: "8761"
---
# Auth Service
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
data:
  SPRING_APPLICATION_NAME: "auth-service"
  SERVER_PORT: "8081"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/postgres"
  SPRING_DATASOURCE_USERNAME: "postgres"
  SPRING_DATASOURCE_PASSWORD: "mypassword"
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_USERNAME: "default"
  SPRING_DATA_REDIS_PASSWORD: "mypassword"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  APP_JWT_SECRET: "3f8a2b1c9d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a"
  APP_JWT_EXPIRATION_MS: "86400000"
  APP_KAFKA_TOPIC_AUTH-EVENTS: "auth-events"
  APP_SIGNUP_DEFAULT-ROLE-ID: "3"
---
# Grades Service
apiVersion: v1
kind: ConfigMap
metadata:
  name: grades-service-config
data:
  SPRING_APPLICATION_NAME: "grades-service"
  SERVER_PORT: "8082"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/postgres"
  SPRING_DATASOURCE_USERNAME: "postgres"
  SPRING_DATASOURCE_PASSWORD: "mypassword"
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_USERNAME: "default"
  SPRING_DATA_REDIS_PASSWORD: "mypassword"
  APP_JWT_SECRET: "3f8a2b1c9d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a"
  SPRING_CACHE_TYPE: "redis"
  SPRING_CACHE_REDIS_TIME-TO-LIVE: "600000"
---
# Notification Service
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
data:
  SPRING_APPLICATION_NAME: "notification-service"
  SERVER_PORT: "8083"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  APP_KAFKA_TOPIC_AUTH-EVENTS: "auth-events"
  APP_NOTIFICATION_FROM-EMAIL: "noreply@mytutorial.com"
  APP_NOTIFICATION_FROM-NAME: "MyTutorial Team"
---
# API Gateway
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
data:
  SPRING_APPLICATION_NAME: "api-gateway"
  SERVER_PORT: "8080"
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_USERNAME: "default"
  SPRING_DATA_REDIS_PASSWORD: "mypassword"
  APP_JWT_SECRET: "3f8a2b1c9d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a"
