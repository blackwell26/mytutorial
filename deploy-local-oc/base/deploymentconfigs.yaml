---
apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  name: eureka-server
  labels:
    app: eureka-server
    tier: backend
spec:
  replicas: 1
  selector:
    app: eureka-server
  triggers:
    - type: ConfigChange
    - type: ImageChange
      imageChangeParams:
        automatic: true
        containerNames:
          - eureka-server
        from:
          kind: ImageStreamTag
          name: eureka-server:latest
  template:
    metadata:
      labels:
        app: eureka-server
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8761"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: mytutorial-sa
      containers:
        - name: eureka-server
          image: eureka-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8761
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mytutorial-shared
            - configMapRef:
                name: eureka-server-config
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8761
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8761
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
