# Nginx reverse proxy for MyTutorial on EC2
#
# Fronts the Spring Boot API gateway (port 8080) with SSL termination,
# rate limiting, and access logging.
#
# For production, replace api.mytutorial.example.com with your actual domain
# and configure SSL certificates via Let's Encrypt (certbot).

upstream api-gateway {
    server 127.0.0.1:8080;
    keepalive 64;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name api.mytutorial.example.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.mytutorial.example.com;

    # SSL — replace with actual cert paths
    ssl_certificate     /etc/nginx/ssl/mytutorial.crt;
    ssl_certificate_key /etc/nginx/ssl/mytutorial.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Access logs
    access_log /var/log/nginx/mytutorial-access.log;
    error_log  /var/log/nginx/mytutorial-error.log warn;

    # CORS preflight
    location /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "http://localhost:4200" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        limit_req zone=api burst=20 nodelay;

        # Forward auth and CORS headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;

        proxy_pass http://api-gateway;
    }

    # Stricter rate limit on sign-in endpoints
    location /api/signin {
        limit_req zone=login burst=3 nodelay;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;

        proxy_pass http://api-gateway;
    }

    # Health check endpoint (no auth)
    location /actuator/health {
        proxy_pass http://api-gateway;
    }

    # Deny all other traffic
    location / {
        return 404;
    }
}
