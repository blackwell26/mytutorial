apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

namePrefix: prod-

commonLabels:
  environment: production
  app.kubernetes.io/env: production

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: DeploymentConfig
      name: auth-service|grades-service|api-gateway
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: DeploymentConfig
      name: notification-service
  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 10
    target:
      kind: HorizontalPodAutoscaler
      name: auth-service-hpa|grades-service-hpa|api-gateway-hpa
  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 5
    target:
      kind: HorizontalPodAutoscaler
      name: notification-service-hpa