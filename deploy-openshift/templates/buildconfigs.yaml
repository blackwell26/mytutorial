apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: eureka-server
  labels:
    app: eureka-server
spec:
  source:
    git:
      uri: https://github.com/your-org/mytutorial.git
      ref: main
    contextDir: backend
  strategy:
    dockerStrategy:
      dockerfilePath: eureka-server/Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: eureka-server:latest
  triggers:
    - type: ConfigChange
    - type: GitHub
      github:
        secretReference:
          name: github-webhook-secret
---
