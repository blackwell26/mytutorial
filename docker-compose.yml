version: "3.9"

networks:
  mytutorial-net:
    driver: bridge

services:

  # ── Infrastructure ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mytutorial-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5434:5432"
    networks:
      - mytutorial-net
    healthcheck:
      test: pg_isready -U postgres
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mytutorial-redis
    ports:
      - "6379:6379"
    networks:
      - mytutorial-net
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6
    container_name: mytutorial-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - mytutorial-net

  kafka:
    image: confluentinc/cp-kafka:7.6
    container_name: mytutorial-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - mytutorial-net

  # ── Backend Services ─────────────────────────────────────────────────────
  eureka-server:
    build:
      context: ./backend
      dockerfile: eureka-server/Dockerfile
    container_name: mytutorial-eureka
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - mytutorial-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    container_name: mytutorial-auth
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka-server:
        condition: service_healthy
    networks:
      - mytutorial-net

  grades-service:
    build:
      context: ./backend
      dockerfile: grades-service/Dockerfile
    container_name: mytutorial-grades
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - mytutorial-net

  notification-service:
    build:
      context: ./backend
      dockerfile: notification-service/Dockerfile
    container_name: mytutorial-notification
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      kafka:
        condition: service_started
      eureka-server:
        condition: service_healthy
    networks:
      - mytutorial-net

  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: mytutorial-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_started
      grades-service:
        condition: service_started
    networks:
      - mytutorial-net

  # ── Monitoring Stack ─────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52
    container_name: mytutorial-prometheus
    volumes:
      - ./docker/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - mytutorial-net
    depends_on:
      - eureka-server
      - auth-service
      - grades-service
      - notification-service
      - api-gateway

  loki:
    image: grafana/loki:3.0
    container_name: mytutorial-loki
    volumes:
      - ./docker/monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - mytutorial-net

  promtail:
    image: grafana/promtail:3.0
    container_name: mytutorial-promtail
    volumes:
      - ./docker/monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    networks:
      - mytutorial-net
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.1
    container_name: mytutorial-grafana
    volumes:
      - ./docker/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./docker/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    networks:
      - mytutorial-net
    depends_on:
      - prometheus
      - loki

  # ── ELK / OpenSearch Stack ──────────────────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.14
    container_name: mytutorial-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./docker/monitoring/opensearch/opensearch.yml:/usr/share/opensearch/config/opensearch.yml
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - mytutorial-net

  logstash:
    image: opensearchproject/logstash-oss-with-opensearch-output-plugin:8.9
    container_name: mytutorial-logstash
    volumes:
      - ./docker/monitoring/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    environment:
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_USER=admin
      - OPENSEARCH_PASSWORD=admin
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    ports:
      - "5000:5000"
    networks:
      - mytutorial-net
    depends_on:
      opensearch:
        condition: service_started

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.14
    container_name: mytutorial-opensearch-dashboards
    volumes:
      - ./docker/monitoring/opensearch-dashboards/opensearch-dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch-dashboards.yml
    ports:
      - "5601:5601"
    networks:
      - mytutorial-net
    depends_on:
      - opensearch

volumes:
  grafana-data:
  opensearch-data:
