input {
  tcp {
    port => 5000
    codec => json
    type => "java-logback"
  }
}

filter {
  json {
    source => "message"
    skip_on_invalid_json => true
  }

  if [app_name] {
    mutate {
      add_field => { "[@metadata][index_prefix]" => "%{app_name}" }
    }
  } else {
    mutate {
      add_field => { "[@metadata][index_prefix]" => "unknown" }
    }
  }

  mutate {
    add_field => { "[@metadata][index_date]" => "%{+YYYY.MM.dd}" }
  }
}

output {
  opensearch {
    hosts       => ["${OPENSEARCH_HOST:-opensearch}:${OPENSEARCH_PORT:-9200}"]
    user        => "${OPENSEARCH_USER:-admin}"
    password    => "${OPENSEARCH_PASSWORD:-admin}"
    index       => "mytutorial-%{[@metadata][index_prefix]}-%{[@metadata][index_date]}"
    ssl         => false
    ssl_certificate_verification => false
    flush_size  => 500
    idle_flush_time => 5
  }

  # Debug output to stdout (visible in Docker logs)
  stdout {
    codec => json
  }
}
